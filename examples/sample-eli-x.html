<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What is caching? — ELI-X</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; max-width: 820px; margin: 2rem auto; padding: 0 1rem; line-height: 1.55; color: #222; }
    h1 { border-bottom: 2px solid #444; padding-bottom: .3rem; }
    .controls { background: #f6f8fa; border: 1px solid #d0d7de; border-radius: 8px; padding: 1rem 1.2rem; margin: 1.2rem 0; }
    .controls label { font-weight: bold; display: block; margin-bottom: .6rem; }
    input[type="range"] { width: 100%; }
    .ticks { display: flex; justify-content: space-between; font-size: .72rem; color: #555; margin-top: .3rem; }
    .ticks span { flex: 1; text-align: center; }
    .ticks span.active { color: #0a558c; font-weight: bold; }
    #level-name { color: #0a558c; }
    #content { margin-top: 1.4rem; }
    #content h2 { color: #0a558c; margin-top: 1.4rem; }
    code { background: #eef1f4; padding: 1px 5px; border-radius: 3px; font-size: .9em; }
    pre { background: #0d1117; color: #e6edf3; padding: .8rem; border-radius: 6px; overflow-x: auto; }
    pre code { background: none; color: inherit; }
    ul { margin-top: .3rem; }
    .meta { font-size: .8rem; color: #666; border-top: 1px solid #eee; margin-top: 2rem; padding-top: .6rem; }
  </style>
</head>
<body>
  <h1>What is caching?</h1>
  <p>Current level: <strong id="level-name">General</strong></p>
  <div class="controls">
    <label for="eli">ELI-X — slide to change the explanation level</label>
    <input type="range" id="eli" min="0" max="4" step="1" value="2" aria-label="Explanation level">
    <div class="ticks">
      <span data-i="0">ELI5</span><span data-i="1">ELI12</span><span data-i="2">General</span><span data-i="3">ASD-STE100</span><span data-i="4">Expert</span>
    </div>
  </div>
  <div id="content"></div>
  <p class="meta">Illustrative general-knowledge example (standard computing concepts). Facts are identical across all five levels; only vocabulary and depth change. Generated by the <code>eli-x-explainer</code> skill.</p>

<script>
const LEVELS = [
  { name: "ELI5", html: `
    <p>Imagine you keep your favorite snacks in a box next to you.</p>
    <p>When you want a snack, you take it from the box — fast! You do not walk all the way to the shop.</p>
    <p>A <strong>cache</strong> is like that snack box for a computer: it keeps copies of things close by, so the computer gets them quickly instead of fetching them from far away.</p>
  ` },
  { name: "ELI12", html: `
    <p>A <strong>cache</strong> keeps copies of things a computer uses a lot in a fast, nearby place.</p>
    <p>If the thing you want is in the cache, that's a <strong>hit</strong> — you get it quickly. If it isn't, that's a <strong>miss</strong> — the computer fetches it from the slow source and saves a copy for next time.</p>
    <p>The cache has limited space, so when it's full the computer removes old items to make room. And a saved copy can get out of date, so it needs to be refreshed sometimes.</p>
  ` },
  { name: "General", html: `
    <h2>Definition</h2>
    <p>A <strong>cache</strong> is a high-speed store that holds copies of frequently used data so the system can avoid a slower fetch or recomputation.</p>
    <h2>How it works</h2>
    <ul>
      <li><strong>Hit:</strong> the data is in the cache → served fast.</li>
      <li><strong>Miss:</strong> not in the cache → fetched from the source, then stored for next time.</li>
      <li><strong>Eviction:</strong> capacity is finite, so old entries are removed (e.g., least-recently-used).</li>
    </ul>
    <h2>Main risk</h2>
    <p>A cached copy can become <strong>stale</strong> (out of date). You manage this with a time limit (TTL) or by invalidating entries when the source changes.</p>
  ` },
  { name: "ASD-STE100", html: `
    <h2>Function</h2>
    <p>A cache keeps copies of data. The copies help the system to get the data quickly.</p>
    <h2>Hit and miss</h2>
    <p>If the cache has the data, this is a hit. The system gets the data from the cache.</p>
    <p>If the cache does not have the data, this is a miss. The system gets the data from the source. Then the system puts a copy in the cache.</p>
    <h2>Limits</h2>
    <p>The cache has a limited size. The system removes old data when the cache is full.</p>
    <h2>Risk</h2>
    <p>Old data can become incorrect. Use a time limit to remove old data.</p>
  ` },
  { name: "Expert", html: `
    <h2>Model</h2>
    <p>A cache is a fast key→value store fronting a slower backing store. Effectiveness is driven by the <strong>hit ratio</strong>; even a modest hit rate can cut mean latency and backing-store load sharply.</p>
    <h2>Policies</h2>
    <ul>
      <li><strong>Eviction:</strong> LRU, LFU, FIFO, ARC — chosen by access pattern and overhead.</li>
      <li><strong>Write:</strong> write-through (write cache+store synchronously), write-back (write cache, flush later), write-around (write store, skip cache).</li>
      <li><strong>Consistency:</strong> TTL expiry, explicit invalidation, or versioned keys.</li>
    </ul>
    <h2>Failure modes</h2>
    <ul>
      <li><strong>Staleness vs. freshness</strong> tradeoff — tighter TTLs reduce staleness but lower hit rate.</li>
      <li><strong>Thundering herd / stampede</strong> when a hot key expires — mitigate with request coalescing (single-flight), jittered TTLs, or early recompute.</li>
    </ul>
    <h2>Signals to watch</h2>
    <p>Hit rate, p50/p99 latency, eviction rate, and backing-store QPS before vs. after the cache.</p>
  ` }
];

const slider = document.getElementById('eli');
const content = document.getElementById('content');
const levelName = document.getElementById('level-name');
const ticks = document.querySelectorAll('.ticks span');
function render(i) {
  content.innerHTML = LEVELS[i].html;
  levelName.textContent = LEVELS[i].name;
  ticks.forEach(t => t.classList.toggle('active', Number(t.dataset.i) === i));
}
slider.addEventListener('input', e => render(Number(e.target.value)));
render(Number(slider.value));
</script>
</body>
</html>
